<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回单批量改名</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--pri:#c8102e;--ok:#12805c;--err:#c0392b;--bd:#e2e5ec}
  @media (prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1d2027;--tx:#e8eaf0;--mut:#9aa2b4;--bd:#2c313b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"Microsoft YaHei",sans-serif}
  main{max-width:900px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{color:var(--mut);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:16px}
  button{font:inherit;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--pri);color:#fff}
  button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .mut{color:var(--mut);font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);word-break:break-all}
  th{color:var(--mut);font-weight:500}
  .ok{color:var(--ok)} .err{color:var(--err)}
  .wrap{overflow-x:auto}
</style>
</head>
<body>
<main>
  <h1>回单批量改名</h1>
  <p class="sub">中国银行「国内支付业务收款回单」PDF → <b>付款人名称_币种金额.pdf</b>，例如 中兴通讯股份有限公司_CNY1765.00.pdf</p>

  <div class="card">
    <div class="row">
      <button id="pick">选择回单文件夹</button>
      <button id="pickFiles" class="sec">或选择多个 PDF 文件</button>
      <input id="fileInput" type="file" accept=".pdf,application/pdf" multiple hidden>
    </div>
    <p class="mut" style="margin:10px 0 0">全部在你自己电脑上处理，文件不会上传。选文件夹可以直接改名（需用 Chrome / Edge 浏览器）；选文件则改为下载改名后的副本。首次打开需要联网加载 PDF 解析组件。</p>
  </div>

  <div class="card" id="result" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div id="summary"></div>
      <button id="go" disabled>确认改名</button>
    </div>
    <div class="wrap"><table>
      <thead><tr><th>原文件名</th><th>新文件名</th><th>状态</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const SPLIT_X = 295;                       // 左栏(收款人) / 右栏(付款人) 分界
const ILLEGAL = /[\\/:*?"<>|\r\n\t]/g;
let items = [];                            // {name, file, handle, newName, status, error}
let dirHandle = null;

// 从一个 PDF 里提取 {payer, amount}
async function extract(file) {
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const content = await (await pdf.getPage(1)).getTextContent();
  const toks = content.items.filter(t => t.str.trim()).map(t => ({s: t.str, x: t.transform[4], y: t.transform[5]}));

  const full = toks.map(t => t.s).join("\n");
  const m = full.match(/金额[：:]\s*([A-Z]{3})\s*([\d,]+\.?\d*)/);
  if (!m) throw new Error("未找到金额");
  const amount = m[1] + m[2].replace(/,/g, "");

  // 右栏按行(y)分组，取「付款人名称：」到「付款人开户行：」之间（名称过长会换行）
  const lines = new Map();
  for (const t of toks.filter(t => t.x >= SPLIT_X - 5)) {
    const key = Math.round(t.y);
    (lines.get(key) || lines.set(key, []).get(key)).push(t);
  }
  const ordered = [...lines.entries()].sort((a, b) => b[0] - a[0])
    .map(([, ts]) => ts.sort((a, b) => a.x - b.x).map(t => t.s).join(""));
  let started = false, parts = [];
  for (let line of ordered) {
    if (line.includes("付款人名称")) { started = true; line = line.split(/付款人名称[：:]/)[1] || ""; }
    else if (started && line.includes("付款人开户行")) break;
    else if (!started) continue;
    parts.push(line);
  }
  const payer = parts.join("").trim().replace(ILLEGAL, "_");
  if (!payer) throw new Error("未找到付款人名称");
  return {payer, amount};
}

// 为每个文件分配不重名的新文件名
function assignNames(existing) {
  const taken = new Set(existing.map(n => n.toLowerCase()));
  for (const it of items) if (!it.error) taken.delete(it.name.toLowerCase());   // 自己的旧名会被释放
  for (const it of items) {
    if (it.error) continue;
    const stem = `${it.payer}_${it.amount}`;
    let n = 1, cand = `${stem}.pdf`;
    while (taken.has(cand.toLowerCase())) cand = `${stem}_${++n}.pdf`;
    taken.add(cand.toLowerCase());
    it.newName = cand;
  }
}

function render() {
  const ok = items.filter(i => !i.error).length, bad = items.length - ok;
  document.getElementById("result").hidden = false;
  document.getElementById("summary").innerHTML =
    `共 ${items.length} 个文件：<b class="ok">${ok} 个可改名</b>` + (bad ? `，<b class="err">${bad} 个识别失败</b>` : "");
  document.getElementById("rows").innerHTML = items.map(i => `
    <tr><td>${esc(i.name)}</td><td>${i.error ? "—" : esc(i.newName)}</td>
    <td class="${i.error ? "err" : i.status === "已改名" ? "ok" : ""}">${esc(i.error || i.status || "待改名")}</td></tr>`).join("");
  document.getElementById("go").disabled = ok === 0 || items.every(i => i.status === "已改名");
  document.getElementById("go").textContent = dirHandle ? "确认改名" : "下载改名后的文件";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(entries, existingNames) {
  items = entries.map(e => ({name: e.name, file: e.file, handle: e.handle}));
  document.getElementById("summary").textContent = "正在识别…";
  document.getElementById("result").hidden = false;
  for (const it of items) {
    try { Object.assign(it, await extract(it.file)); }
    catch (e) { it.error = e.message || String(e); }
  }
  assignNames(existingNames);
  render();
}

document.getElementById("pick").onclick = async () => {
  if (!window.showDirectoryPicker) { alert("当前浏览器不支持直接改名，请用 Chrome 或 Edge；或点「选择多个 PDF 文件」下载改名后的副本。"); return; }
  try { dirHandle = await showDirectoryPicker({mode: "readwrite"}); } catch { return; }
  const entries = [], all = [];
  for await (const [name, h] of dirHandle.entries()) {
    all.push(name);
    if (h.kind === "file" && name.toLowerCase().endsWith(".pdf")) entries.push({name, handle: h, file: await h.getFile()});
  }
  entries.sort((a, b) => a.name.localeCompare(b.name));
  await load(entries, all);
};

document.getElementById("pickFiles").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = async e => {
  dirHandle = null;
  const files = [...e.target.files].sort((a, b) => a.name.localeCompare(b.name));
  await load(files.map(f => ({name: f.name, file: f})), []);
};

document.getElementById("go").onclick = async () => {
  const btn = document.getElementById("go"); btn.disabled = true;
  for (const it of items) {
    if (it.error || it.status === "已改名") continue;
    try {
      if (dirHandle) {
        // 先写入新名字再删旧文件（比 move() 兼容性好）
        const nh = await dirHandle.getFileHandle(it.newName, {create: true});
        const w = await nh.createWritable(); await w.write(it.file); await w.close();
        await dirHandle.removeEntry(it.name);
      } else {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(it.file); a.download = it.newName; a.click();
        await new Promise(r => setTimeout(r, 250));
        URL.revokeObjectURL(a.href);
      }
      it.status = "已改名";
    } catch (e) { it.status = "失败：" + (e.message || e); }
    render();
  }
  render();
};
</script>
</body>
</html>
